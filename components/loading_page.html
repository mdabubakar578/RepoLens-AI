{% extends "layout.html" %}

{% block title %}Analyzing... — {{ APP_NAME }}{% endblock %}

{% block content %}
<section class="page-content" style="min-height: 70vh; display: flex; align-items: center; justify-content: center;">
  <div class="container container--narrow text-center">
    
    <div class="card animate-fade-in-up" style="padding:var(--space-8) var(--space-6); max-width: 500px; margin: 0 auto;">
      
      <div style="margin-bottom:var(--space-6)">
        <div class="skeleton" style="width: 64px; height: 64px; border-radius: var(--radius-sm); margin: 0 auto;"></div>
      </div>
      
      <h1 style="font-size: 1.5rem; margin-bottom: var(--space-2)">Analyzing Repository</h1>
      <p class="text-muted" id="status-text">{{ analysis.stage or "Queued" }}</p>
      
      <div style="margin-top:var(--space-6); background:var(--panel-2); height:4px; border-radius:2px; overflow:hidden; position:relative;">
        <div id="progress-bar" style="position:absolute; top:0; left:0; height:100%; width:{{ analysis.progress or 0 }}%; background:var(--accent); border-radius:2px; transition: width 0.35s ease;"></div>
      </div>
      
      <div class="mt-4">
        <p class="text-xs" style="color:var(--text-muted); font-family:var(--font-mono)" id="poll-info">
          Analysis ID: {{ analysis.id }}
        </p>
      </div>

    </div>

  </div>
</section>
{% endblock %}

{% block extra_js %}
<script nonce="{{ csp_nonce }}">
  const targetFmt = "{{ fmt }}";
  const statusUrl = "{{ url_for("home.status", analysis_id=analysis.id) }}";
  const resultUrl = "{{ url_for("analyze.result", analysis_id=analysis.id) }}";
  const progressBar = document.getElementById("progress-bar");
  const statusText = document.getElementById("status-text");
  const pollInfo = document.getElementById("poll-info");
  const pollStartedAt = Date.now();

  async function checkStatus() {
    const elapsed = Date.now() - pollStartedAt;
    if (elapsed >= 600000) {
      statusText.textContent = "This analysis exceeded the interactive wait limit.";
      pollInfo.textContent = "Open History to check later, or retry the analysis.";
      return;
    }
    try {
      const response = await fetch(statusUrl + "?t=" + Date.now(), {cache: "no-store"});
      if (response.ok) {
        const data = await response.json();
        progressBar.style.width = (data.progress || 0) + "%";
        statusText.textContent = data.stage || "Processing repository";
        if (data.status === "done") {
          window.location.href = resultUrl + "?fmt=" + targetFmt;
          return;
        }
        if (data.status === "error") {
          window.location.href = "/";
          return;
        }
      }
    } catch (error) {
      statusText.textContent = "Connection interrupted. Retrying...";
    }
    setTimeout(checkStatus, elapsed < 30000 ? 1000 : 3000);
  }
  checkStatus();
</script>
{% endblock %}
